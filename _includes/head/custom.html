<style>
/* ─── Light mode overrides (applied when data-theme="light") ─── */
[data-theme="light"] {
  --bg-color: #fff;
  --text-color: #222;
  --primary-color: #3d85c6;
  --border-color: #e0e0e0;
  --code-bg: #f5f5f5;
  --masthead-bg: #fff;
  --masthead-text: #393e46;
  --footer-bg: #f2f2f2;
  --link-color: #3d85c6;
  --link-hover: #2a5d8f;
  --nav-hover-bg: #e8e8e8;
  --sidebar-bg: #f9f9f9;
  --toc-bg: #f9f9f9;
  --blockquote-color: #555;
}

[data-theme="light"] body,
[data-theme="light"] .page__content {
  background-color: var(--bg-color) !important;
  color: var(--text-color) !important;
}

[data-theme="light"] .masthead {
  background-color: var(--masthead-bg) !important;
  border-bottom: 1px solid var(--border-color) !important;
}

[data-theme="light"] .masthead a,
[data-theme="light"] .masthead__menu-item a {
  color: var(--masthead-text) !important;
}

[data-theme="light"] .greedy-nav {
  background-color: var(--masthead-bg) !important;
}

[data-theme="light"] .greedy-nav a {
  color: var(--masthead-text) !important;
}

[data-theme="light"] .greedy-nav a:hover {
  color: var(--primary-color) !important;
}

[data-theme="light"] .page__footer {
  background-color: var(--footer-bg) !important;
  color: #555 !important;
}

[data-theme="light"] a {
  color: var(--link-color) !important;
}

[data-theme="light"] a:hover {
  color: var(--link-hover) !important;
}

[data-theme="light"] .sidebar,
[data-theme="light"] .author__content,
[data-theme="light"] .author__urls-wrapper {
  color: var(--text-color) !important;
}

[data-theme="light"] .toc {
  background-color: var(--toc-bg) !important;
  border: 1px solid var(--border-color) !important;
}

[data-theme="light"] .toc a {
  color: var(--text-color) !important;
}

[data-theme="light"] blockquote {
  border-left-color: var(--primary-color) !important;
  color: var(--blockquote-color) !important;
}

[data-theme="light"] code {
  background-color: var(--code-bg) !important;
  color: #333 !important;
}

[data-theme="light"] pre {
  background-color: #f5f5f5 !important;
  border: 1px solid var(--border-color) !important;
}

[data-theme="light"] table th {
  background-color: #f0f0f0 !important;
  color: var(--text-color) !important;
}

[data-theme="light"] table td {
  border-color: var(--border-color) !important;
  color: var(--text-color) !important;
}

[data-theme="light"] h1, [data-theme="light"] h2,
[data-theme="light"] h3, [data-theme="light"] h4 {
  color: var(--text-color) !important;
}

[data-theme="light"] .page__title {
  color: var(--text-color) !important;
}

[data-theme="light"] .archive__item-title a {
  color: var(--text-color) !important;
}

[data-theme="light"] .archive__item-excerpt {
  color: #555 !important;
}

[data-theme="light"] .page__meta,
[data-theme="light"] .page__date {
  color: #888 !important;
}

[data-theme="light"] .pagination a {
  color: var(--text-color) !important;
  border-color: var(--border-color) !important;
}

[data-theme="light"] .search__toggle {
  color: var(--masthead-text) !important;
}

[data-theme="light"] input.search-input {
  background-color: #fff !important;
  color: var(--text-color) !important;
  border-color: var(--border-color) !important;
}

/* ─── 라이트 모드 코드 하이라이팅 (Rouge) ───────────────────────────────
   다크 스킨의 Rouge 토큰 색이 라이트 배경(#f5f5f5)에 그대로 얹히면
   본문 토큰이 rgb(238,255,255) → 명도비 1.05:1 로 사실상 보이지 않는다.
   아래 팔레트는 모두 #f5f5f5 대비 4.9:1 이상(WCAG AA 통과)으로 맞췄다. */
[data-theme="light"] .highlight,
[data-theme="light"] .highlight pre,
[data-theme="light"] pre.highlight,
[data-theme="light"] .highlighter-rouge .highlight {
  background-color: #f5f5f5 !important;
  color: #24292f !important;
}
[data-theme="light"] .highlight code,
[data-theme="light"] .highlight pre code {
  color: #24292f !important;
}

/* 주석 */
[data-theme="light"] .highlight .c,
[data-theme="light"] .highlight .ch,
[data-theme="light"] .highlight .cd,
[data-theme="light"] .highlight .cm,
[data-theme="light"] .highlight .cp,
[data-theme="light"] .highlight .cpf,
[data-theme="light"] .highlight .c1,
[data-theme="light"] .highlight .cs { color: #5b6771 !important; font-style: italic; }

/* 키워드 */
[data-theme="light"] .highlight .k,
[data-theme="light"] .highlight .kc,
[data-theme="light"] .highlight .kd,
[data-theme="light"] .highlight .kn,
[data-theme="light"] .highlight .kp,
[data-theme="light"] .highlight .kr,
[data-theme="light"] .highlight .ow { color: #cf222e !important; }

/* 문자열 */
[data-theme="light"] .highlight .s,
[data-theme="light"] .highlight .sa,
[data-theme="light"] .highlight .sb,
[data-theme="light"] .highlight .sc,
[data-theme="light"] .highlight .dl,
[data-theme="light"] .highlight .sd,
[data-theme="light"] .highlight .s2,
[data-theme="light"] .highlight .se,
[data-theme="light"] .highlight .sh,
[data-theme="light"] .highlight .si,
[data-theme="light"] .highlight .sx,
[data-theme="light"] .highlight .sr,
[data-theme="light"] .highlight .s1,
[data-theme="light"] .highlight .ss { color: #0a3069 !important; }

/* 숫자 · 상수 · 내장 */
[data-theme="light"] .highlight .m,
[data-theme="light"] .highlight .mb,
[data-theme="light"] .highlight .mf,
[data-theme="light"] .highlight .mh,
[data-theme="light"] .highlight .mi,
[data-theme="light"] .highlight .il,
[data-theme="light"] .highlight .mo,
[data-theme="light"] .highlight .nb,
[data-theme="light"] .highlight .bp,
[data-theme="light"] .highlight .no { color: #0550ae !important; }

/* 함수 · 클래스 · 속성 · 데코레이터 */
[data-theme="light"] .highlight .nf,
[data-theme="light"] .highlight .fm,
[data-theme="light"] .highlight .nc,
[data-theme="light"] .highlight .na,
[data-theme="light"] .highlight .nd { color: #6639ba !important; }

/* 변수 · 타입 · 라벨 */
[data-theme="light"] .highlight .nv,
[data-theme="light"] .highlight .vc,
[data-theme="light"] .highlight .vg,
[data-theme="light"] .highlight .vi,
[data-theme="light"] .highlight .kt,
[data-theme="light"] .highlight .nl { color: #953800 !important; }

/* 태그 · 네임스페이스 · 예외 */
[data-theme="light"] .highlight .nt,
[data-theme="light"] .highlight .nn,
[data-theme="light"] .highlight .ne { color: #116329 !important; }

/* 연산자 · 구두점 · 일반 이름 */
[data-theme="light"] .highlight .o,
[data-theme="light"] .highlight .p,
[data-theme="light"] .highlight .n,
[data-theme="light"] .highlight .py,
[data-theme="light"] .highlight .w { color: #24292f !important; }

/* 오류 */
[data-theme="light"] .highlight .err { color: #a40e26 !important; background: none !important; }

/* diff */
[data-theme="light"] .highlight .gd { color: #82071e !important; background-color: #ffebe9 !important; }
[data-theme="light"] .highlight .gi { color: #116329 !important; background-color: #dafbe1 !important; }
[data-theme="light"] .highlight .gh { color: #0550ae !important; font-weight: bold; }
[data-theme="light"] .highlight .gu { color: #6639ba !important; }
[data-theme="light"] .highlight .ge { font-style: italic; }
[data-theme="light"] .highlight .gs { font-weight: bold; }

/* 줄번호 거터 */
[data-theme="light"] .highlight .gl,
[data-theme="light"] .rouge-gutter,
[data-theme="light"] .lineno { color: #8b949e !important; background: none !important; }

/* ─── Mermaid 다이어그램 ─── */
.mermaid {
  margin: 1.5em 0;
  text-align: center;
  overflow-x: auto;      /* 넓은 다이어그램은 가로 스크롤 */
  background: none;
  line-height: normal;
}
.mermaid svg {
  max-width: 100%;
  height: auto;
}
/* 렌더 전 원본 텍스트가 잠깐 노출되는 것을 방지 */
.mermaid:not([data-processed]) {
  visibility: hidden;
}

/* ─── Toggle button ─── */
.theme-toggle {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.2rem;
  padding: 4px 8px;
  margin-left: 0.5rem;
  line-height: 1;
  vertical-align: middle;
  opacity: 0.8;
  transition: opacity 0.2s;
}
.theme-toggle:hover {
  opacity: 1;
}
</style>

<!-- Apply saved theme before page renders to prevent flash -->
<script>
(function() {
  var saved = localStorage.getItem('theme');
  if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
  }
})();
</script>
